name: Generate baseline profile

# Regenerates app/src/main/generated/baselineProfiles/baseline-prof.txt on a managed emulator
# and uploads it as an artifact. Download it and commit it to the repo.
on:
  workflow_dispatch:
    inputs:
      server:
        description: Jellyfin server URL to profile against (defaults to the public demo server)
        required: false
        type: string

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate baseline profile
        env:
          ORG_GRADLE_PROJECT_WholphinExtensionsUsername: "${{ secrets.EXTENSIONS_USERNAME }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsPassword: "${{ secrets.EXTENSIONS_PASSWORD }}"
          SERVER: ${{ inputs.server }}
        run: |
          args=()
          if [[ -n "$SERVER" ]]; then
            args+=("-Pandroid.testInstrumentationRunnerArguments.wholphin.server=$SERVER")
          fi
          ./gradlew :app:generateBaselineProfile "${args[@]}" \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.androidTest.numManagedDeviceShards=1 \
            --no-daemon
      - name: Upload baseline profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseline-profile
          path: |
            app/src/main/generated/baselineProfiles/*
          if-no-files-found: error
